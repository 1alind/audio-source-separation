<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>StemLab Diagnostics</title><link rel="stylesheet" href="./styles.css">
<style>
.diag{width:min(100% - 32px,820px);margin:54px auto 80px;position:relative;z-index:1}.diag h1{font-size:clamp(38px,7vw,58px);letter-spacing:-2.8px;margin:18px 0 12px}.intro{color:#9ba5b4;line-height:1.7;font-size:13px}.panel{margin-top:24px;padding:20px;background:#111923;border:1px solid #293240;border-radius:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn{border:0;border-radius:9px;padding:12px 16px;background:var(--accent);color:#10150b;font-weight:800;cursor:pointer}.btn.alt{background:#202936;color:#e7edf6;border:1px solid #354151}.btn:disabled{opacity:.5;cursor:wait}.summary{font-size:12px;color:#aab4c2}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid #2b3542;border-radius:10px;background:#0c1118}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:12px;font-weight:750}.status{font-size:9px;font-weight:900;letter-spacing:1px}.pass{color:#b7f36b}.fail{color:#ff929b}.warn{color:#ffd27a}.run{color:#9dc4ff}.detail{font-size:11px;line-height:1.6;color:#8995a5;margin:7px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}.report{width:100%;min-height:170px;margin-top:16px;padding:12px;background:#080b10;color:#cbd5e1;border:1px solid #2b3542;border-radius:9px;font:11px/1.55 ui-monospace,monospace}.back{color:var(--accent);text-decoration:none;font-size:12px}
</style></head><body>
<header class="topbar"><a class="brand" href="./"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><span>stem<span class="brand-light">lab</span></span></a><a class="back" href="./">← Back to StemLab</a></header>
<main class="diag"><div class="eyebrow"><span class="eyebrow-line"></span> TROUBLESHOOTING</div><h1>Find what's<br><span style="color:var(--accent)">breaking.</span></h1><p class="intro">Checks browser support, storage, both download hosts, ONNX Runtime and the saved model. If the model is already saved, it also tries creating a session and running a tiny inference test. Nothing is uploaded.</p>
<section class="panel"><div class="actions"><button class="btn" id="run">Run all tests</button><button class="btn alt" id="copy" disabled>Copy report</button></div><p class="summary" id="summary">Starting…</p><div class="list" id="list"></div><textarea class="report" id="report" readonly spellcheck="false" placeholder="Diagnostic report…"></textarea></section></main>
<script>
(() => {
"use strict";
const $=id=>document.getElementById(id), ORT="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js", MODEL="https://huggingface.co/StemSplitio/htdemucs-onnx/resolve/main/htdemucs_fp16weights.onnx";
const DB="stemlab-model-storage", STORE="models", KEY="htdemucs-fp16-v1"; let rows=[],busy=false;
function report(){const p=rows.filter(x=>x.s==="pass").length,f=rows.filter(x=>x.s==="fail").length,w=rows.filter(x=>x.s==="warn").length;$("summary").textContent=rows.length+" checks · "+p+" passed · "+f+" failed · "+w+" warnings";$("report").value=["STEMLAB DIAGNOSTIC REPORT","Time: "+new Date().toISOString(),"Page: "+location.href,"Browser: "+navigator.userAgent,"Online: "+navigator.onLine,"CPU threads: "+(navigator.hardwareConcurrency||"unknown"),"Device memory: "+(navigator.deviceMemory||"not exposed"),"",...rows.map(x=>"["+x.s.toUpperCase()+"] "+x.n+"\n"+x.d)].join("\n");$("copy").disabled=!rows.length}
function add(n,s,d){rows.push({n,s,d:String(d||"")});const el=document.createElement("div");el.className="item";el.innerHTML='<div class="head"><span class="name"></span><span class="status"></span></div><p class="detail"></p>';el.querySelector(".name").textContent=n;el.querySelector(".status").textContent=s.toUpperCase();el.querySelector(".status").classList.add(s);el.querySelector(".detail").textContent=d;$("list").append(el);report()}
async function test(n,fn){const i=rows.length;add(n,"run","Testing…");try{rows[i]={n,s:"pass",d:String(await fn())}}catch(e){rows[i]={n,s:"fail",d:e&&e.stack||String(e)}}const el=$("list").children[i];el.querySelector(".status").className="status "+rows[i].s;el.querySelector(".status").textContent=rows[i].s.toUpperCase();el.querySelector(".detail").textContent=rows[i].d;report()}
function loadScript(url){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=url;s.async=true;s.onload=ok;s.onerror=()=>no(Error("Script failed to load: "+url));document.head.append(s)})}
function openDB(){return new Promise((ok,no)=>{if(!indexedDB) return no(Error("IndexedDB API missing"));const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error||Error("IndexedDB open failed"))})}
async function saved(){const db=await openDB();return new Promise((ok,no)=>{const r=db.transaction(STORE,"readonly").objectStore(STORE).get(KEY);r.onsuccess=()=>{db.close();ok(r.result||null)};r.onerror=()=>{db.close();no(r.error)}})}
async function run(){if(busy)return;busy=true;rows=[];$("list").replaceChildren();$("run").disabled=true;$("run").textContent="Testing…";
try{
await test("Secure context",()=>{if(!isSecureContext)throw Error("HTTPS secure context required.");return location.protocol+" · secure context OK"});
await test("WebAssembly",()=>{if(!WebAssembly||!WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0])))throw Error("WebAssembly unavailable.");return "Available"});
await test("Web Audio",()=>{if(!(window.AudioContext||window.webkitAudioContext))throw Error("AudioContext missing.");return "AudioContext available"});
await test("IndexedDB write/read",async()=>{const db=await openDB(),key="__stemlab_test__";await new Promise((ok,no)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put("ok",key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});const v=await new Promise((ok,no)=>{const r=db.transaction(STORE,"readonly").objectStore(STORE).get(key);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});await new Promise(ok=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(key);tx.oncomplete=ok;tx.onerror=ok});db.close();if(v!=="ok")throw Error("Read-after-write mismatch");return "Open, write, read and delete passed"});
await test("Storage quota",async()=>{if(!navigator.storage?.estimate)throw Error("Storage estimate API unavailable");const x=await navigator.storage.estimate();return "Used "+(x.usage/1048576).toFixed(1)+" MB · quota "+(x.quota/1048576).toFixed(1)+" MB"});
await test("ONNX Runtime CDN response",async()=>{const r=await fetch(ORT,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const t=await r.text();if(t.length<10000)throw Error("Unexpected short response: "+t.slice(0,200));return "HTTP "+r.status+" · "+t.length.toLocaleString()+" characters"});
await test("ONNX Runtime global",async()=>{if(!window.ort)await loadScript(ORT);if(!window.ort)throw Error("Script loaded but window.ort is undefined. This reproduces the current app error.");if(!ort.InferenceSession||!ort.Tensor)throw Error("Runtime global exists but required APIs are missing");return "window.ort, InferenceSession and Tensor found"});
await test("Hugging Face model host",async()=>{const r=await fetch(MODEL,{method:"HEAD",redirect:"follow",cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return "HTTP "+r.status+" · "+(r.headers.get("content-length")||"size hidden by host")+" · "+r.url});
await test("Saved model in browser",async()=>{const m=await saved();if(!m)throw Error("No model stored. Not downloading 166 MB automatically.");const n=m.byteLength||m.length||0;if(n<1000000)throw Error("Saved model looks incomplete: "+n+" bytes");return "Found "+(n/1048576).toFixed(1)+" MB"});
if(window.ort?.InferenceSession)await test("Model session + inference (single-thread)",async()=>{const m=await saved();if(!m)throw Error("Skipped: no saved model");const bytes=m.byteLength||m.length||0;ort.env.wasm.numThreads=1;ort.env.wasm.proxy=false;let s;try{s=await ort.InferenceSession.create(m,{executionProviders:["wasm"],graphOptimizationLevel:"disabled",enableCpuMemArena:false,enableMemPattern:false})}catch(e){const detail=(e&&e.name?e.name+": ":"")+(e&&e.message?e.message:String(e));throw Error("Session creation failed with 1 WASM thread and graph optimizations disabled. Model size: "+(bytes/1048576).toFixed(1)+" MB. Runtime: "+ort.version+" . Original error: "+detail+"\\nStack: "+(e&&e.stack||"not exposed"))}try{const name=s.inputNames[0],shape=[1,2,343980],tensor=new ort.Tensor("float32",new Float32Array(shape[1]*shape[2]),shape);let out;try{out=await s.run({[name]:tensor})}catch(e){throw Error("Session loaded, but inference failed: "+(e&&e.name?e.name+": ":"")+(e&&e.message?e.message:String(e))+"\\n"+(e&&e.stack||""))}const o=out[s.outputNames[0]];if(!o?.data?.length)throw Error("Inference returned no output tensor");return "Session and zero-audio inference passed · "+name+" → "+s.outputNames[0]}finally{await s.release()}});
else add("Model session + inference","warn","Skipped because ONNX Runtime did not initialize.");
}catch(e){add("Diagnostic runner","fail",e.stack||String(e))}
finally{busy=false;$("run").disabled=false;$("run").textContent="Run all tests again";report()}}
window.addEventListener("error",e=>add("Uncaught browser error","warn",(e.message||"Unknown")+" · "+e.filename+":"+e.lineno));
window.addEventListener("unhandledrejection",e=>add("Unhandled promise rejection","warn",e.reason?.stack||String(e.reason)));
$("run").addEventListener("click",run);$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("report").value);$("copy").textContent="Copied"}catch(e){$("report").focus();$("report").select();$("copy").textContent="Select and copy"}});run();
})();
</script></body></html>
